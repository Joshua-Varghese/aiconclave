# Cloudflare Pages + D1 config for AI Conclave registrations.
# Source of truth lives in db/. CI copies this to the repo root before deploy
# (Pages does not allow --config with a custom path).

name = "aiconclave"
compatibility_date = "2026-07-25"
pages_build_output_dir = "publish"

[[d1_databases]]
binding = "DB"
database_name = "aiconclave-registrations"
database_id = "cfc0669f-3de7-4429-ab54-686e966bb56b"
preview_database_id = "DB"
