name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static assets only in publish/. Pages Functions stay at repo root
      # (./functions) and are picked up by wrangler pages deploy via wrangler.toml.
      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp index.html style.css script.js publish/
          cp -r About Schedule Participate Register publish/

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          # Deploy from repo root so wrangler.toml + functions/ are included.
          command: pages deploy publish --project-name=aiconclave --branch=main --commit-dirty=true
