name: Deploy to Cloudflare Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: pages-production
  cancel-in-progress: true

jobs:
  deploy:
    name: Production deploy
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Static assets go in publish/.
      # DB stack lives under db/; Pages requires wrangler.toml + functions/
      # at the deploy root, so copy them in for the upload only.
      - name: Prepare publish directory
        run: |
          mkdir -p publish
          cp index.html style.css script.js publish/
          cp -r About Schedule Participate Register publish/
          cp db/wrangler.toml ./wrangler.toml
          rm -rf functions
          cp -r db/functions ./functions

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "4.38.0"
          command: pages deploy publish --project-name=aiconclave --branch=main --commit-dirty=true
